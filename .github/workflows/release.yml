name: Publish API-Load image

# 推 main 只发 edge 和 sha 镜像；推 vX.Y.Z 标签才发正式版本号和主版本通道。
# 两种情况都先跑完整 CI，测试不过不发镜像。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-load-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve API-Load version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="${version}-edge.${GITHUB_SHA::7}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/thewisewolfholo/api-load
          flavor: latest=false
          tags: |
            type=sha,prefix=v2-sha-
            type=raw,value=edge,enable=${{ steps.version.outputs.release != 'true' }}
            type=raw,value=v${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=2,enable=${{ steps.version.outputs.release == 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
